<button (click)="cambiarRol()">Cambiar rol</button>
<p *ngIf="errorCarga()">{{ errorCarga()}}</p>
<p *ngIf="errorGuardado()">{{ errorGuardado()}}</p>

<div [ngSwitch]="rol()" *ngIf="productos$ | async as productos; else cargando">
  <app-tabla-productos
    *ngSwitchCase="'admin'"
    [productos]="productos"
  />
  <ng-container *ngSwitchCase="'customer'"> 
    <div class="grilla"><app-tarjeta-producto
      *ngFor="let producto of productos; trackBy: trackById"
      [producto]="producto"
      (agregarAlCarrito)="agregarProducto($event)"
    />
    </div>
    <p>Items: {{ cantidadProductos() }}</p>
    <p>Total: {{ totalCarrito() }}</p>
    <p *ngIf="productos.length === 0"> No hay productos para mostrar
    </p>
  </ng-container>
</div>
<ng-template #cargando>
  <p>Cargando productos...</p>
</ng-template>

<label for="categorias">Elige una categoria:</label>
<select
  id="categorias"
  name="categorias"
  (change)="cambiarCategoria($any($event.target).value === '' ? null : +$any($event.target).value)"
>
<option value ="">Todas las categorias</option>
  <option *ngFor="let categoria of categorias$ | async" [value]="categoria.id">
  {{ categoria.name }}
</option>
</select>
